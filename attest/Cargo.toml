[package]
name = "attest"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"
description = "Sign Ampoule run receipts as in-toto statements in DSSE envelopes, and verify them"

[[bin]]
name = "ampoule-verify"
path = "src/bin/ampoule-verify.rs"

[dependencies]
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.11"
serde = "1"
serde_json = "1"
